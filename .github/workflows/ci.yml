name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --verbose /repo

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://filedrop:filedrop@localhost:5432/filedrop
      DIRECT_URL: postgresql://filedrop:filedrop@localhost:5432/filedrop

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: filedrop
          POSTGRES_PASSWORD: filedrop
          POSTGRES_USER: filedrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filedrop -d filedrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm security:audit

      - name: Validate database schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Validate production configuration contract
        run: pnpm deploy:check
        env:
          APP_URL: https://filedrop.example.test
          # Non-secret, deterministic fixture; never use this key in a deployment.
          SHARE_TOKEN_KEYRING: '{"active":"fixture","keys":{"fixture":"0101010101010101010101010101010101010101010101010101010101010101"}}'
          DATABASE_URL: postgresql://filedrop:not-a-real-password@db-pooler.example.test/filedrop?sslmode=require
          DIRECT_URL: postgresql://filedrop:not-a-real-password@db.example.test/filedrop?sslmode=require
          SESSION_SECRET: not-a-real-session-fixture-value-for-ci
          UPLOAD_PASSWORD_HASH: $scrypt$ln=16,r=8,p=1$AwMDAwMDAwMDAwMDAwMDAw$BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
          CRON_SECRET: not-a-real-cleanup-fixture-value-for-ci
          R2_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID: not-a-real-access-key-id
          R2_SECRET_ACCESS_KEY: not-a-real-storage-credential
          R2_BUCKET_NAME: filedrop-ci

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production Compose model
        env:
          FILEDROP_DOMAIN: filedrop.example.test
          FILEDROP_MIGRATION_ENV_FILE: ${{ github.workspace }}/deploy/migration.env.example
          FILEDROP_RUNTIME_ENV_FILE: ${{ github.workspace }}/deploy/runtime.env.example
        run: docker compose --file deploy/compose.production.yaml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          --env FILEDROP_DOMAIN=filedrop.example.test
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build runtime image
        run: >-
          docker build --target runtime
          --build-arg APP_REVISION="${{ github.sha }}"
          --tag filedrop:ci .

      - name: Build operations image
        run: docker build --target operations --tag filedrop-operations:ci .

      - name: Check image boundaries
        run: |
          test "$(docker image inspect filedrop:ci --format '{{.Config.User}}')" = node
          docker run --rm --entrypoint /bin/sh filedrop:ci -c \
            'test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/prisma && test ! -e /app/node_modules/.bin/prisma'
          docker run --rm --network none filedrop-operations:ci pnpm --version

      - name: Start hardened runtime image
        run: >-
          docker run --detach --name filedrop-container-test
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
          --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
          --env APP_URL=http://127.0.0.1:3100
          --env DATABASE_URL=postgresql://unused:unused@127.0.0.1:5432/unused
          --publish 127.0.0.1:3100:3000
          filedrop:ci

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect filedrop-container-test --format '{{.State.Health.Status}}')"
            if [ "$status" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect filedrop-container-test --format '{{.State.Health.Status}}')" = healthy
          curl --fail --silent --show-error http://127.0.0.1:3100/api/health

      - name: Remove test container
        if: always()
        run: docker rm --force filedrop-container-test || true
