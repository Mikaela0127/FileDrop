name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --verbose /repo

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://filedrop:filedrop@localhost:5432/filedrop

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: filedrop
          POSTGRES_PASSWORD: filedrop
          POSTGRES_USER: filedrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filedrop -d filedrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate database schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Validate production configuration contract
        run: pnpm deploy:check
        env:
          APP_URL: https://filedrop.example.test
          DATABASE_URL: postgresql://filedrop:not-a-real-password@db.example.test/filedrop?sslmode=require
          SESSION_SECRET: not-a-real-session-fixture-value-for-ci
          UPLOAD_PASSWORD_HASH: $scrypt$ln=16,r=8,p=1$AwMDAwMDAwMDAwMDAwMDAw$BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
          CRON_SECRET: not-a-real-cleanup-fixture-value-for-ci
          R2_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID: not-a-real-access-key-id
          R2_SECRET_ACCESS_KEY: not-a-real-storage-credential
          R2_BUCKET_NAME: filedrop-ci

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
