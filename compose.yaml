name: filedrop

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: filedrop
      POSTGRES_PASSWORD: filedrop
      POSTGRES_USER: filedrop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filedrop_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filedrop -d filedrop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  filedrop_postgres_data:
